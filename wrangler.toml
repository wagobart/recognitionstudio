name = "recognition-studio"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# NOTE: values in [vars] override the Cloudflare dashboard on every deploy.
# The OpenAI key is NOT here — it is a Pages *secret* (see README "OpenAI key").
[vars]
AI_MODE = "live"                    # "mock" = free test artwork, no OpenAI calls
IMAGE_MODEL = "gpt-image-2.5-sunburst"
IMAGE_SIZE = "1536x1024"
IMAGE_QUALITY = "high"
PLANNER_MODEL = "gpt-4.1-mini"
SIGNUP_MODE = "open"                # "invite" = only ALLOWED_EMAILS can create accounts; "open" = anyone
ALLOWED_EMAILS = "wagobart@gmail.com,madisonlashae@outlook.com"
MAIL_FROM = "Crafted In Honor <noreply@craftedinhonor.com>"  # password-reset sender; domain must be verified in Resend (secret RESEND_API_KEY)
ADMIN_EMAILS = "wagobart@gmail.com"      # can add/remove shared Examples (My projects → Examples)
ACCOUNT_ART_LIMIT = "15"            # AI artwork designs per account in total (free versions, photos, no-artwork designs don't count)
UNLIMITED_EMAILS = "wagobart@gmail.com"  # no per-account total (daily limit still applies)
DAILY_ART_LIMIT = "50"              # artwork generations per user per 24h
MONTHLY_BUDGET_USD = "75"          # app-side ceiling on estimated monthly AI spend (all users); a scheduled task alerts Bart at 80% and when reached
EST_COST_PER_IMAGE = "0.10"         # actual 2026-10-31: 37 images + 24 plans = $2.87 (~7.8¢/image); small cushion
EST_COST_PER_PLAN = "0.01"

[[d1_databases]]
binding = "DB"
database_name = "recognition-studio"
database_id = "0e69c3fc-10bf-4d7d-8176-c228c6bb7b7a"

[[r2_buckets]]
binding = "ART"
bucket_name = "recognition-studio-art"
